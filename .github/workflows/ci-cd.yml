name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*" # Triggers when pushing a release tag like v1.0.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: tag_name
        run: |
          # If triggered by a git tag (e.g., v1.0.1), strip the 'v' -> 1.0.1
          # Otherwise, fallback to the short Git SHA
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(echo "${{ github.sha }}" | cut -c1-7)
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            rodas01/seb-exam-portal:${{ steps.tag_name.outputs.VERSION }}
            rodas01/seb-exam-portal:latest

      - name: Update Image Tag in Kubernetes Manifest
        run: |
          sed -i "s|image: rodas01/seb-exam-portal:.*|image: rodas01/seb-exam-portal:${{ steps.tag_name.outputs.VERSION }}|g" k8s/rollout.yaml

      - name: Commit and Push Updated Manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update rollout image tag to ${{ steps.tag_name.outputs.VERSION }}"
          file_pattern: "k8s/rollout.yaml"
