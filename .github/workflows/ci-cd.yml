name: CI/CD Pipeline

on:
  push:
    tags:
      - "v*.*.*" # Triggers on release tags like v1.0.2, v1.0.3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract Tag Name
        id: get_version
        run: |
          # Strips the 'v' prefix to extract clean semver (e.g., v1.0.2 -> 1.0.2)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            rodas01/seb-exam-portal:${{ steps.get_version.outputs.VERSION }}
            rodas01/seb-exam-portal:latest

      # --- GitOps Step: Update Deployment Manifest ---
      - name: Update Image Tag in Kubernetes Manifest
        run: |
          sed -i "s|image: rodas01/seb-exam-portal:.*|image: rodas01/seb-exam-portal:${{ steps.get_version.outputs.VERSION }}|g" k8s/rollout.yaml

      - name: Commit and Push Updated Manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "release: update rollout image tag to ${{ steps.get_version.outputs.VERSION }}"
          file_pattern: "k8s/rollout.yaml"
